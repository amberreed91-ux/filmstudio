  - id: matching-service
    title: 'video metadata matching service'
    prompt: |
      Implement the `VideoMetadataMatchingService` for the Study Room auto-match feature.

      ## Context

      The project is at `/Users/amberreed/Enhanced_adaptive_strategy_python/studio-project/studio-backend/`.
      - `VideoAsset` model at `app/models/__init__.py` (line ~404).
      - `SceneIntelligenceRecord` at `app/models/scene_intelligence.py` — this is the metadata library.
      - `SceneIntelligenceStore` at `app/services/scene_intelligence_store.py` — already exists.
      - `DatabaseStorage` at `app/data/storage.py` — already has video_asset persistence.
      - `VideoAssetService` at `app/services/video_asset_service.py` — already exists.
      - Storage instance is configured as `get_storage("sqlite")` in `app/routes/projects.py`.

      ## Work

      Create `app/services/video_metadata_matching_service.py` with this content:

      ```python
      from __future__ import annotations
      import re
      import uuid
      from datetime import datetime, timezone
      from difflib import SequenceMatcher
      from pathlib import Path
      from typing import Any, Dict, List, Optional, Tuple

      from app.models import VideoAsset
      from app.models.scene_intelligence import SceneIntelligenceRecord
      from app.services.scene_intelligence_store import scene_intelligence_store
      from app.data.storage import DatabaseStorage

      # Confidence thresholds
      CONFIDENCE_AUTO_CONFIRM = 0.95
      CONFIDENCE_STRONG = 0.80
      CONFIDENCE_POSSIBLE = 0.60

      class VideoMetadataMatchingService:
          def __init__(self, storage: Optional[DatabaseStorage] = None) -> None:
              self._storage = storage
              self._metadata_store = scene_intelligence_store

          def _now_iso(self) -> str:
              return datetime.now(timezone.utc).isoformat()

          def _generate_match_id(self) -> str:
              return f"match-{uuid.uuid4().hex[:12]}"

          # ---- normalization helpers ----

          def _normalize(self, value: str) -> str:
              """Normalize text for comparison: lowercase, strip, remove special chars."""
              if not value:
                  return ""
              return re.sub(r"[^a-z0-9]+", " ", value.lower()).strip()

          def _extract_base_name(self, filename: str) -> str:
              """Extract base name without extension."""
              if not filename:
                  return ""
              stem = Path(filename).stem
              # Handle double extensions like .mp4
              for ext in [".mp4", ".mov", ".webm"]:
                  if stem.lower().endswith(ext):
                      stem = stem[: -len(ext)]
              return stem

          # ---- scoring helpers ----

          def _exact_match_score(self, asset_filename: str, metadata_filename: str) -> Tuple[float, List[str]]:
              """Score based on exact/normalized filename match. Returns (score, matched_fields)."""
              if not asset_filename or not metadata_filename:
                  return 0.0, []
              matched_fields: List[str] = []
              score = 0.0

              # Exact match
              if asset_filename == metadata_filename:
                  score = 1.0
                  matched_fields.append("filename_exact")
              # Normalized exact match
              norm_asset = self._normalize(asset_filename)
              norm_meta = self._normalize(metadata_filename)
              if norm_asset and norm_meta and norm_asset == norm_meta:
                  score = max(score, 0.98)
                  matched_fields.append("filename_normalized")

              return score, matched_fields

          def _title_similarity_score(self, asset_title: str, metadata_title: str) -> Tuple[float, List[str]]:
              """Score based on title similarity using SequenceMatcher."""
              if not asset_title or not metadata_title:
                  return 0.0, []
              norm_asset = self._normalize(asset_title)
              norm_meta = self._normalize(metadata_title)
              if not norm_asset or not norm_meta:
                  return 0.0, []
              ratio = SequenceMatcher(None, norm_asset, norm_meta).ratio()
              matched_fields: List[str] = []
              if ratio >= 0.90:
                  score = 0.95
                  matched_fields.append("title_similarity_exact")
              elif ratio >= 0.75:
                  score = 0.85
                  matched_fields.append("title_similarity_strong")
              elif ratio >= 0.60:
                  score = 0.70
                  matched_fields.append("title_similarity_possible")
              else:
                  score = 0.0
              return score, matched_fields

          def _scene_match_score(self, asset_title: str, scene_record: Dict[str, Any]) -> Tuple[float, List[str]]:
              """Score based on scene_id / scene_name / film_title match."""
              if not asset_title or not scene_record:
                  return 0.0, []
              norm_asset = self._normalize(asset_title)
              if not norm_asset:
                  return 0.0, []
              matched_fields: List[str] = []
              best_score = 0.0

              scene_id = self._normalize(scene_record.get("scene_id", ""))
              scene_name = self._normalize(scene_record.get("scene_name", ""))
              film_title = self._normalize(scene_record.get("film_title", ""))

              candidates = [
                  scene_id,
                  scene_name,
                  film_title,
                  f"{film_title} {scene_name}" if film_title and scene_name else "",
                  f"{film_title} {scene_id}" if film_title and scene_id else "",
              ]

              for candidate in candidates:
                  if not candidate:
                      continue
                  if norm_asset == candidate:
                      best_score = max(best_score, 0.96)
                      matched_fields.append("scene_id_match")
                  elif norm_asset in candidate or candidate in norm_asset:
                      ratio = SequenceMatcher(None, norm_asset, candidate).ratio()
                      if ratio >= 0.80:
                          best_score = max(best_score, 0.85)
                          if "scene_title_similarity" not in matched_fields:
                              matched_fields.append("scene_title_similarity")

              return best_score, matched_fields

          def _duration_score(self, asset_duration: Optional[float], metadata_duration: Optional[float]) -> float:
              """Score based on duration similarity."""
              if asset_duration is None or metadata_duration is None:
                  return 0.0
              if asset_duration <= 0 or metadata_duration <= 0:
                  return 0.0
              diff = abs(asset_duration - metadata_duration)
              ratio = diff / max(asset_duration, metadata_duration)
              if ratio <= 0.02:
                  return 0.10
              elif ratio <= 0.05:
                  return 0.05
              return 0.0

          def _file_size_score(self, asset_size: Optional[int], metadata_size: Optional[int]) -> float:
              """Score based on file size similarity."""
              if asset_size is None or metadata_size is None:
                  return 0.0
              if asset_size <= 0 or metadata_size <= 0:
                  return 0.0
              diff = abs(asset_size - metadata_size)
              ratio = diff / max(asset_size, metadata_size)
              if ratio <= 0.01:
                  return 0.05
              return 0.0

          # ---- main matching methods ----

          def score_metadata_match(self, asset: VideoAsset, metadata_record: Dict[str, Any]) -> Tuple[float, List[str], str]:
              """
              Score a single VideoAsset against a single SceneIntelligenceRecord.
              Returns (confidence, matched_fields, match_reason).
              """
              base_name = self._extract_base_name(asset.title)
              original_filename = (asset.metadata or {}).get("original_filename", "")
              compare_names = [base_name, original_filename]

              all_matched_fields: List[str] = []
              total_score = 0.0
              reasons: List[str] = []

              # 1. Exact filename match
              for name in compare_names:
                  if name:
                      score, fields = self._exact_match_score(name, metadata_record.get("scene_id", ""))
                      if score > 0:
                          total_score += score * 1.0
                          all_matched_fields.extend(fields)
                          reasons.append(f"exact match: {name}")
                      score, fields = self._exact_match_score(name, metadata_record.get("scene_name", ""))
                      if score > 0:
                          total_score += score * 0.95
                          all_matched_fields.extend(fields)
                          reasons.append(f"exact scene_name match: {name}")
                      score, fields = self._exact_match_score(name, metadata_record.get("film_title", ""))
                      if score > 0:
                          total_score += score * 0.90
                          all_matched_fields.extend(fields)
                          reasons.append(f"exact film_title match: {name}")

              # 2. Title similarity
              title = base_name or original_filename
              if title:
                  for field in ["scene_id", "scene_name", "film_title"]:
                      meta_val = metadata_record.get(field, "")
                      if meta_val:
                          score, fields = self._title_similarity_score(title, meta_val)
                          if score > 0:
                              weight = 0.90 if field == "scene_name" else 0.85
                              total_score += score * weight
                              all_matched_fields.extend(fields)
                              reasons.append(f"title similarity ({field}): {score:.2f}")

              # 3. Scene title similarity
              if title:
                  score, fields = self._scene_match_score(title, metadata_record)
                  if score > 0:
                      total_score += score * 0.85
                      all_matched_fields.extend(fields)
                      reasons.append(f"scene match score: {score:.2f}")

              # 4. Duration
              dur_score = self._duration_score(
                  asset.duration_seconds,
                  metadata_record.get("duration_seconds"),
              )
              if dur_score > 0:
                  total_score += dur_score
                  all_matched_fields.append("duration_similarity")
                  reasons.append(f"duration similarity: +{dur_score:.2f}")

              # 5. File size
              size_score = self._file_size_score(
                  asset.file_size_bytes,
                  metadata_record.get("file_size_bytes"),
              )
              if size_score > 0:
                  total_score += size_score
                  all_matched_fields.append("file_size_similarity")
                  reasons.append(f"file size similarity: +{size_score:.2f}")

              # Deduplicate matched_fields
              all_matched_fields = list(dict.fromkeys(all_matched_fields))

              confidence = min(1.0, total_score)
              match_reason = "; ".join(reasons[:3]) if reasons else "no match signals found"

              return confidence, all_matched_fields, match_reason

          def find_candidate_matches_for_asset(self, asset: VideoAsset) -> List[Dict[str, Any]]:
              """Find all potential metadata matches for a VideoAsset, sorted by confidence."""
              metadata_records = self._metadata_store.list_records()
              candidates: List[Dict[str, Any]] = []

              for record in metadata_records:
                  confidence, matched_fields, match_reason = self.score_metadata_match(asset, record)
                  if confidence >= CONFIDENCE_POSSIBLE:
                      candidates.append({
                          "metadata_record": record,
                          "metadata_id": record.get("scene_id", ""),
                          "confidence": confidence,
                          "matched_fields": matched_fields,
                          "match_reason": match_reason,
                      })

              # Sort by confidence descending
              candidates.sort(key=lambda x: x["confidence"], reverse=True)
              return candidates

          def auto_match_uploaded_asset(self, asset_id: str) -> Optional[Dict[str, Any]]:
              """Run auto-match for a newly uploaded asset. Returns match result or None."""
              if not self._storage:
                  return None

              asset = self._storage.get_video_asset(asset_id)
              if not asset:
                  return None

              candidates = self.find_candidate_matches_for_asset(asset)
              if not candidates:
                  return None

              best = candidates[0]
              confidence = best["confidence"]
              metadata_record = best["metadata_record"]
              metadata_id = best["metadata_id"]
              matched_fields = best["matched_fields"]
              match_reason = best["match_reason"]

              now = self._now_iso()
              match_status = "auto_confirmed" if confidence >= CONFIDENCE_AUTO_CONFIRM else "proposed"

              match = self._storage.save_video_metadata_match(
                  VideoMetadataMatch(
                      match_id=self._generate_match_id(),
                      asset_id=asset_id,
                      metadata_id=metadata_id,
                      project_id=asset.project_id,
                      match_status=match_status,
                      match_confidence=confidence,
                      match_reason=match_reason,
                      matched_fields=matched_fields,
                      created_at=now,
                      updated_at=now,
                      metadata={
                          "scene_name": metadata_record.get("scene_name", ""),
                          "film_title": metadata_record.get("film_title", ""),
                          "intent": metadata_record.get("intent", ""),
                          "emotional_beat_arc": metadata_record.get("emotional_beat_arc", []),
                          "camera_logic": metadata_record.get("camera_logic", []),
                          "pacing_curve": metadata_record.get("pacing_curve", []),
                          "director_notes": metadata_record.get("director_notes", ""),
                          "source": "metadata_library",
                          "matched_metadata_id": metadata_id,
                          "match_reason": match_reason,
                      },
                  )
              )

              return {
                  "match": match,
                  "confidence": confidence,
                  "match_status": match_status,
                  "metadata_record": metadata_record,
              }

          def confirm_match(self, match_id: str) -> Optional[VideoMetadataMatch]:
              """Confirm a proposed match."""
              if not self._storage:
                  return None
              match = self._storage.get_video_metadata_match(match_id)
              if not match:
                  return None
              match.match_status = "confirmed"
              match.updated_at = self._now_iso()
              return self._storage.save_video_metadata_match(match)

          def reject_match(self, match_id: str) -> Optional[VideoMetadataMatch]:
              """Reject a proposed match."""
              if not self._storage:
                  return None
              match = self._storage.get_video_metadata_match(match_id)
              if not match:
                  return None
              match.match_status = "rejected"
              match.updated_at = self._now_iso()
              return self._storage.save_video_metadata_match(match)

          def list_matches_for_asset(self, asset_id: str) -> List[VideoMetadataMatch]:
              """List all matches for an asset."""
              if not self._storage:
                  return []
              return self._storage.list_video_metadata_matches_for_asset(asset_id)

          def list_unmatched_assets(self) -> List[VideoAsset]:
              """List video assets that have no confirmed/auto_confirmed metadata match."""
              if not self._storage:
                  return []
              all_assets = self._storage.list_video_assets(source_type="uploaded_file")
              matched_asset_ids = {
                  m.asset_id for m in self._storage.list_video_metadata_matches()
                  if m.match_status in ("confirmed", "auto_confirmed")
              }
              return [a for a in all_assets if a.asset_id not in matched_asset_ids]


      video_metadata_matching_service = VideoMetadataMatchingService()
      ```

      Report the file created.
