      You are redesigning the AI Film Studio app with a cinematic physical studio aesthetic.
      Working directory: /Users/amberreed/Enhanced_adaptive_strategy_python/studio-project/studio-app

      DESIGN SYSTEM (already in place — use these tokens, do NOT redefine them):
      - --color-surface-0: #080808
      - --color-surface-1: #0a0a0a
      - --color-surface-2: #0d0d0d
      - --color-surface-3: #111111
      - --color-border: #1e1e1e
      - --color-border-subtle: #161616
      - --color-accent: #00d4aa
      - --color-text-primary: #e8e8e8
      - --color-text-secondary: #888
      - --color-text-muted: #444
      - --color-text-ghost: #333
      - --radius-sm: 4px
      - --radius-md: 8px
      - --radius-lg: 12px
      All tokens are already in src/styles/design-tokens.css. Reference them in inline styles or Tailwind arbitrary values.

      GLOBAL SHELL — already done (TopNav has layoutId="active-tab", App.tsx has AnimatePresence):
      - TopNav.tsx: already has the dark design with Framer Motion layoutId="active-tab" and command bar
      - App.tsx: already wraps routes in AnimatePresence with opacity 0→1, y 8→0, duration 0.2s
      - StudioLayout.tsx: already a thin flex-col wrapper
      - DO NOT touch these files — they are done

      EXISTING COMPONENTS — keep these working, only change visual presentation:
      - StudioShell: wraps pages with TopNav + breadcrumbs, keep all props
      - AICrewPresence: keep as-is, it's lazy-loaded
      - ProjectContextBar, ProjectGuard: keep as-is
      - DirectorDebatePanel: keep as-is
      - All API calls, data fetching, and state management: keep exactly as-is

      RULES:
      - DO NOT break any existing functionality — UI changes only
      - DO NOT touch any .test.tsx files
      - DO NOT touch src/lib/ or src/hooks/ or src/context/ directories
      - Keep ALL existing state, props, API calls, and handlers
      - Framer Motion is already installed and imported in existing files
      - Use CSS inline styles referencing the design tokens (already defined in :root)
      - All surfaces must be #080808 to #111111 range — NO white backgrounds
      - Zinc palette + teal accent (#00d4aa) only — no new colors

      ========================
      ROOM 1: STUDIO LOBBY — "The Gate"
      ========================
      File: src/pages/StudioLobby.tsx (StudioLobby component)

      CURRENT STATE: Has "Welcome to Studio" hero with cyan/emerald buttons, project cards grid, room directory. Wrapped in StudioShell.

      REDESIGN SPEC:
      - Full-bleed dark hero: large typographic treatment "Direct. Shape. Remember." — thin font weight, tight letter-spacing. Use inline styles with fontWeight: '200' or '300', letterSpacing: '-0.03em'.
      - Film grain overlay: CSS-only using SVG filter at 2-3% opacity. Add this pattern to the hero section:
        ```css
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E");
        ```
        Apply via inline style on the hero container.
      - Film cards: dark rounded cards with progress bar and render status — use surface-2 background, border-border, rounded-lg
      - Stats row: 4 stats (projects, rendering, approved, drafts) — minimal number + label, use surface-2 panels
      - Right sidebar: AI Crew Presence panel (already exists as LazyAICrewPresence) — integrate it into the layout
      - "Start a New Film" button: use teal accent (#00d4aa) — border, text, and subtle glow
      - Room directory cards: use surface-1 background, teal accent on hover
      - Film grain texture on Studio Home hero ONLY (not on other rooms)

      ========================
      ROOM 2: WRITERS ROOM — "The Page"
      ========================
      File: src/pages/WritersRoom.tsx (WritersRoom component)

      CURRENT STATE: Already has a room hero section with eyebrow label "Writers Room", title "The Page". Has scene list with INT/EXT/DAY/NIGHT tags. Wrapped in StudioShell > ProjectGuard > ProjectContextBar.

      REDESIGN SPEC:
      - The existing room hero is already close to spec. Enhance it:
        - Make the eyebrow label smaller (11px), tracking 0.2em, teal accent color
        - Make the title larger (4xl or 5xl), thin font weight (200-300), tight letter-spacing (-0.02em)
        - Add a subtle subtitle
      - Left panel: scene list with INT/EXT/DAY/NIGHT tags as small pills
        - Active scene highlighted with teal border-left (2px solid #00d4aa)
      - Right sidebar: clapboard visual — stripe pattern header using CSS:
        ```css
        background: repeating-linear-gradient(90deg, #111 0px, #111 40px, #1a1a1a 40px, #1a1a1a 80px);
        ```
        - Production metadata (project title, scene count)
        - Co-director notes feed (existing DirectorDebatePanel component)
      - Use surface-1/surface-2 panels consistently
      - All borders: 0.5px solid #1e1e1e

      ========================
