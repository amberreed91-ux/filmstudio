      CURRENT STATE: 3107 lines, massive component with many sub-panels (CinematicShowcase, DecisionGateCard, DirectorConsole, PrevisIntelligencePanel, AudienceSimulatorModal). The component already has some dark styling. You need to:
      
      1. Add the room hero at the top (inside the component, after ProjectContextBar, before the main content):
      ```tsx
      <section className="rounded-2xl border p-8 mb-8" style={{ background: 'var(--color-surface-1)', borderColor: 'var(--color-border)' }}>
        <div className="text-[11px] uppercase tracking-[0.2em]" style={{ color: 'var(--color-accent)' }}>Previs Room</div>
        <h1 className="mt-3 text-4xl font-light tracking-tight" style={{ color: 'var(--color-text-primary)', letterSpacing: '-0.02em' }}>
          The Lightboard
        </h1>
        <p className="mt-2 text-sm" style={{ color: 'var(--color-text-secondary)' }}>
          Visual planning and storyboarding. Frame your story.
        </p>
      </section>
      ```

      2. Style the main storyboard grid: 3-column grid, each frame has viewfinder corner marks using CSS:
      ```css
      .storyboard-frame { position: relative; }
      .storyboard-frame::before, .storyboard-frame::after,
      .storyboard-frame > div:first-child::before, .storyboard-frame > div:first-child::after {
        content: '';
        position: absolute;
        width: 12px; height: 12px;
        border-color: var(--color-accent);
        border-style: solid;
      }
      .storyboard-frame::before { top: 0; left: 0; border-width: 1.5px 0 0 1.5px; }
      .storyboard-frame::after { top: 0; right: 0; border-width: 1.5px 1.5px 0 0; }
      /* etc. */
      ```
      
      3. Style the shot list: shot type pill, lens note, blocking note — use surface-1/surface-2
      4. Right sidebar: film strip decorative element (CSS repeating gradient stripes), lens intelligence panel
      5. The component is huge — focus on: (a) adding the room hero, (b) styling the existing storyboard/shot-grid area, (c) adding viewfinder corner marks to frames

      ========================
      ROOM 4: SCREENING ROOM — "The Theater"
      ========================
      File: src/pages/ScreeningRoom.tsx (ScreeningRoom component)

      CURRENT STATE: 2338 lines, massive component with ScreeningCinematicShowcase, render activity panel, co-director collaboration panel, timeline intelligence, director memory callbacks, etc.

      REDESIGN SPEC:
      1. Add the room hero at the top (after ProjectContextBar):
