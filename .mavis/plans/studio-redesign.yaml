      <section className="rounded-2xl border p-8 mb-8" style={{ background: 'var(--color-surface-1)', borderColor: 'var(--color-border)' }}>
        <div className="text-[11px] uppercase tracking-[0.2em]" style={{ color: 'var(--color-accent)' }}>Screening Room</div>
        <h1 className="mt-3 text-4xl font-light tracking-tight" style={{ color: 'var(--color-text-primary)', letterSpacing: '-0.02em' }}>
          The Theater
        </h1>
        <p className="mt-2 text-sm" style={{ color: 'var(--color-text-secondary)' }}>
          Review cuts, compare iterations, simulate audiences.
        </p>
      </section>
      ```

      2. Style the main video screen area:
      - Large 2.39:1 screen frame with viewfinder corners (CSS borders)
      - Transport controls: play/pause/skip, timeline scrubber, timecode — dark pill design
      - Cut timeline: horizontal scroll of scene thumbnails with transition badges (CUT, DISS, FADE)
      - Use rounded pill shapes for transport buttons (border-radius: 20px)
      
      3. Right sidebar: runtime stats, audience simulation cards

      ========================
      VERIFICATION:
      ========================
      After completing all 4 rooms, verify:
      1. Read src/App.tsx — confirm it has AnimatePresence page transitions (it should already)
      2. Read src/components/TopNav.tsx — confirm it has the dark design and Framer Motion (it should already)
      3. Read src/styles/design-tokens.css — confirm design tokens exist (they should already)
      4. Check that no .test.tsx files were modified
      5. Check that no src/lib/, src/hooks/, or src/context/ files were changed
      6. Run: cd /Users/amberreed/Enhanced_adaptive_strategy_python/studio-project/studio-app && npx tsc --noEmit 2>&1 | head -50
         If there are errors, fix them.
      7. Report: list of files changed, any issues encountered, tsc result.

      IMPORTANT: Do NOT ask for confirmation. Work through each room in order. Write deliverable.md when done listing all changed files and tsc result.
    assigned_to: developer
    verified_by: verifier
    verify_prompt: |
