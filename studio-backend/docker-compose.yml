version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    environment:
      - STORAGE_TYPE=sqlite
      - STORAGE_PATH=/data
      - DEBUG=false
      - LOG_LEVEL=INFO
    volumes:
      - studio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./studio-app/dist:/var/www/studio-app/dist:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  studio-data: