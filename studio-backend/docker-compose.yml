services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8010:8010"
    environment:
      - APP_ENV=production
      - STUDIO_ACCESS_MODE=authenticated
      - DEMO_MODE=false
      - STORAGE_PATH=/app/data
      - STUDIO_STORAGE_PATH=/app/data
      - STUDIO_PROJECT_STORE_PATH=/app/data/project_state_store.json
      - LOG_FORMAT=${LOG_FORMAT:-text}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-120}
      - BACKUP_ENABLED=${BACKUP_ENABLED:-true}
      - BACKUP_DIR=/app/backups
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
    volumes:
      - studio-data:/app/data
      - studio-outputs:/app/outputs
      - studio-static:/app/static
      - studio-backups:/app/backups
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/ready"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/ssl:/etc/nginx/ssl:ro
      - ../studio-app/dist:/var/www/studio-app/dist:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  studio-data:
  studio-outputs:
  studio-static:
  studio-backups:
