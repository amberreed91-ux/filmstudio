[pytest]
asyncio_mode = auto
testpaths = app tests
norecursedirs = outputs output backups data reports models scripts static deployment docs __pycache__ .git .venv *.egg-info
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
markers =
    unit: fast unit tests
    integration: integration tests
    batch: batch render tests
    retry: retry logic tests
    asyncio: mark test as asynchronous
